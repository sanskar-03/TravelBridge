name: TravelBridge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: travelbridge_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-django

      - name: Check Django Deployment Settings
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-testing-only'
          DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/travelbridge_test'
          REDIS_URL: 'redis://localhost:6379/0'
          DJANGO_DEBUG: 'False'
        run: |
          cd backend
          python manage.py check --deploy

      - name: Check Missing Migrations
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-testing-only'
          DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/travelbridge_test'
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: 'ci-secret-key-testing-only'
          DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/travelbridge_test'
          REDIS_URL: 'redis://localhost:6379/0'
          AI_MODE: 'mock'
        run: |
          cd backend
          pytest

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Type Checks
        run: |
          cd frontend
          npm run lint || true
          npm run type-check || true

      - name: Validate Production Build
        run: |
          cd frontend
          npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate Production Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml config
